name: Derleme

on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Testler
        run: dotnet test --project tests/Boyut.Core.Tests -c Release

      - name: CLI
        run: dotnet build src/Boyut.Cli/Boyut.Cli.csproj -c Release --nologo

      - name: Uygulama (x64)
        run: dotnet build src/Boyut.App/Boyut.App.csproj -c Release -p:Platform=x64 --nologo

      - name: Uygulama (ARM64)
        run: dotnet build src/Boyut.App/Boyut.App.csproj -c Release -p:Platform=ARM64 --nologo
