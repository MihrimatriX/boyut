name: Derleme

on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # TEMPORARY: screenshot ref above
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Testler
        run: dotnet test --project tests/Boyut.Core.Tests -c Release

      - name: CLI
        run: dotnet build src/Boyut.Cli/Boyut.Cli.csproj -c Release --nologo

      - name: Uygulama (x64)
        run: dotnet build src/Boyut.App/Boyut.App.csproj -c Release -p:Platform=x64 --nologo

      # Starts the real app, scans a folder and walks every page with UI Automation: catches XAML that compiles
      # but fails at runtime (missing resources, bad styles, crashes on navigation). Screenshots are kept as an artifact.
      - name: Arayüz duman testi
        shell: powershell
        run: |
          $exe = Get-ChildItem src/Boyut.App/bin/x64/Release -Recurse -Filter Boyut.exe | Select-Object -First 1
          ./tools/ui-smoke.ps1 -Exe $exe.FullName -Out ui-smoke

      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke
          path: ui-smoke
          if-no-files-found: ignore

      # TEMPORARY (design review): hidden ref with the screenshots, only on manual runs.
      - name: Ekran görüntülerini refs/ci/ui-smoke'a it
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cd ui-smoke
          git init -q
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "ui-smoke ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/ci/ui-smoke

      - name: Uygulama (ARM64)
        run: dotnet build src/Boyut.App/Boyut.App.csproj -c Release -p:Platform=ARM64 --nologo
